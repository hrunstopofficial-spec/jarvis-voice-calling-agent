<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS Executive Calling Agent</title>
    <meta name="theme-color" content="#0a0d14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" href="/static/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="phone-frame" id="phoneContainer">
        <!-- ARC Reactor Hologram Ring -->
        <div class="hud-orb ringing" id="hudOrb">
            <div class="orb-ring ring-1"></div>
            <div class="orb-ring ring-2"></div>
            <div class="orb-core">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
            </div>
        </div>

        <!-- Caller Info Header -->
        <div class="caller-info">
            <h1 class="caller-title">JARVIS PRIME</h1>
            <p class="caller-status" id="callStatus">INCOMING EXECUTIVE CALL...</p>
            <p class="caller-clock hidden" id="callClock" style="font-size: 14px; color: #00e5ff; margin-top: 4px; font-weight: 600;">00:00</p>
            <div class="waveform" id="waveform">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>

        <!-- Real-Time Dialogue Transcript Box -->
        <div class="transcript-area" id="transcriptBox">
            <div class="msg-bubble msg-jarvis">
                <strong>JARVIS:</strong> Incoming call for Mukil. Tap green button to attend!
            </div>
        </div>

        <!-- Incoming Call Controls (Accept / Decline) -->
        <div class="controls-row" id="incomingControls">
            <button class="btn-circle btn-decline" onclick="declineCall()" title="Decline Call">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <button class="btn-circle btn-accept" onclick="acceptCall()" title="Accept Call">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#042f2e" stroke-width="2.5">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
            </button>
        </div>

        <!-- Active Call In-Progress Controls -->
        <div class="controls-row hidden" id="activeControls">
            <button class="btn-util" id="muteBtn" onclick="toggleMute()" title="Mute/Unmute">
                <span id="micLabel">Mute</span>
            </button>
            <button class="btn-circle btn-decline" onclick="endCall()" title="End Call">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5">
                    <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path>
                    <line x1="23" y1="1" x2="1" y2="23"></line>
                </svg>
            </button>
            <button class="btn-util" onclick="triggerManualListen()" title="Force Listen">
                <span>Mic</span>
            </button>
        </div>
    </div>

    <script src="/static/js/call_app.js"></script>
</body>
</html>
